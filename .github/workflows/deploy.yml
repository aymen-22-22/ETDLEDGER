name: Build production branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      CPANEL_REPO: ${{ vars.CPANEL_REPO || '/home/qrtvfyrp/repositories/ETDL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://etdledger.com
          BASE_PATH: /
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - run: cp deploy-config/.cpanel.yml dist/.cpanel.yml
      - name: Publish built site to the production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Build site from

      - name: Pull and deploy on cPanel over SSH
        if: env.SSH_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the whole key, including the BEGIN and END lines."; exit 1; }
          echo "Using key: $(ssh-keygen -l -f ~/.ssh/deploy_key)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "bash -s" -- "$CPANEL_REPO" <<'REMOTE'
          set -eu
          repo="$1"
          run() {
            out=$(uapi "$@")
            echo "$out" | grep -qE '^  status: 1$' || { echo "$out"; echo "::error::uapi $1 $2 failed"; exit 1; }
          }
          run VersionControl update repository_root="$repo" branch=production
          echo "Pulled production into $repo"
          run VersionControlDeployment create repository_root="$repo"
          echo "Deployment queued"
          REMOTE
      - name: Explain skipped cPanel deploy
        if: env.SSH_PRIVATE_KEY == ''
        run: echo "::warning::SSH_HOST, SSH_USER and SSH_PRIVATE_KEY secrets are not set, so production was built but not deployed. Click Update from Remote and Deploy HEAD Commit in cPanel, or add the secrets."
