name: Build production branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_REPO: ${{ vars.CPANEL_REPO || '/home/qrtvfyrp/repositories/ETDL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://etdledger.com
          BASE_PATH: /
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - run: cp deploy-config/.cpanel.yml dist/.cpanel.yml
      - name: Publish built site to the production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Build site from

      - name: Pull and deploy on cPanel
        if: env.CPANEL_TOKEN != ''
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body -G "https://${CPANEL_HOST}:2083/execute/$1" \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "repository_root=${CPANEL_REPO}" "${@:2}"
          }
          check() {
            echo "$1" | jq -e '.status == 1' >/dev/null || { echo "::error::cPanel $2 failed: $(echo "$1" | jq -c '.errors')"; exit 1; }
          }
          out=$(api VersionControl/update --data-urlencode "branch=production"); check "$out" "pull"
          echo "Pulled production: $(echo "$out" | jq -r '.data.last_update.identifier // "ok"')"
          out=$(api VersionControlDeployment/create); check "$out" "deploy"
          echo "Deployment queued: task $(echo "$out" | jq -r '.data.task_id // "?"')"
      - name: Explain skipped cPanel deploy
        if: env.CPANEL_TOKEN == ''
        run: echo "::warning::CPANEL_HOST, CPANEL_USER and CPANEL_TOKEN secrets are not set, so production was built but not deployed. Click Update from Remote and Deploy HEAD Commit in cPanel, or add the secrets."
